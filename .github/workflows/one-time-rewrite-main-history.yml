name: One-time rewrite main history

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Rewrite commit 8dcf5f15 (author + message), replay rest
        run: |
          set -euo pipefail
          git config user.name "and-vin"
          git config user.email "andrew.vinokurov@gmail.com"

          git checkout -B main-rewrite origin/main

          GIT_SEQUENCE_EDITOR="sed -i '0,/Add social preview image/{s/^pick/edit/}'" \
            git rebase -i 8a86b1836a1681406dbe1ac69f0df034a38cf926

          GIT_AUTHOR_NAME="and-vin" GIT_AUTHOR_EMAIL="andrew.vinokurov@gmail.com" \
          GIT_COMMITTER_NAME="and-vin" GIT_COMMITTER_EMAIL="andrew.vinokurov@gmail.com" \
            git commit --amend -m "Add social preview image for GitHub link cards"

          git rebase --continue

          echo "--- new log ---"
          git log --oneline -6

      - name: Verify tree unchanged before force-push
        run: |
          set -euo pipefail
          old_tree=$(git rev-parse origin/main^{tree})
          new_tree=$(git rev-parse HEAD^{tree})
          echo "old tree: $old_tree"
          echo "new tree: $new_tree"
          if [ "$old_tree" != "$new_tree" ]; then
            echo "ERROR: tree mismatch, refusing to push"
            exit 1
          fi

      - name: Force-push rewritten main
        run: git push --force-with-lease origin main-rewrite:main
