name: Smoke test (public endpoints)

on:
  schedule:
    - cron: "0 6 1,15 * *"
  push:
    branches: [main, "codex/**"]
    paths:
      - "openapi.yaml"
      - "examples/search.json"
      - "scripts/smoke_test.py"
      - ".github/workflows/smoke-test.yml"
  pull_request:
    paths:
      - "openapi.yaml"
      - "examples/search.json"
      - "scripts/smoke_test.py"
      - ".github/workflows/smoke-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check public search, catalog and book card
        run: python scripts/smoke_test.py

  report-failure:
    needs: smoke
    if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "Smoke test failed: public endpoints";
            const label = "smoke-test-failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `Public-endpoint smoke test failed.\n\nRun: ${runUrl}`,
                labels: [label],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Still failing.\n\nRun: ${runUrl}`,
              });
            }
