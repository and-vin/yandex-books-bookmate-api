name: One-time rewrite main history v4

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fix author of the three library_cards-pagination commits
        env:
          FILTER_BRANCH_SQUELCH_WARNING: "1"
        run: |
          set -euo pipefail
          git checkout -B main-rewrite-v4 origin/main

          git filter-branch -f --commit-filter '
            case "$GIT_COMMIT" in
              12e5ebb39deee1dc1d76012c701b21fe1609a859|d65ab6c15fcf717b424134a575b5165952390580|8fd1f8c073177c8d5ff9edf2138617d9a4a708b3)
                export GIT_AUTHOR_NAME="and-vin"
                export GIT_AUTHOR_EMAIL="andrew.vinokurov@gmail.com"
                export GIT_COMMITTER_NAME="and-vin"
                export GIT_COMMITTER_EMAIL="andrew.vinokurov@gmail.com"
                ;;
            esac
            git commit-tree "$@"
          ' -- 17cb2995e947402aa511d43293103c3afd6d0c7f..HEAD

          echo "--- new log ---"
          git log --oneline --format='%H %an <%ae> %s' -6

      - name: Verify tree unchanged before force-push
        run: |
          set -euo pipefail
          old_tree=$(git rev-parse origin/main^{tree})
          new_tree=$(git rev-parse HEAD^{tree})
          if [ "$old_tree" != "$new_tree" ]; then
            echo "ERROR: tree mismatch, refusing to push"
            exit 1
          fi

      - name: Force-push rewritten main
        run: git push --force-with-lease origin main-rewrite-v4:main
