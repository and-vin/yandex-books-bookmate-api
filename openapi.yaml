components:
  securitySchemes:
    AuthToken:
      type: apiKey
      in: header
      name: Auth-Token
      description: |
        OAuth-токен Яндекса (`y0_AgAAAA...`). Получение: переход по
        `https://oauth.yandex.ru/authorize?response_type=token&client_id=4483e97bab6e486a9822973109a14d05`,
        токен возвращается во фрагменте redirect URL (`#access_token=...`).
        Подробности — §2 карты API.

  responses:
    Unauthorized:
      description: Токен отсутствует, истёк или отозван
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: "Числовой ID, UUID или псевдоним профиля (в ответах API — поле `login`, но это не логин Яндекс-аккаунта, общий для всех сервисов Яндекса, а отдельный публичный псевдоним профиля Яндекс Книг)"
      schema:
        type: string
    Uuid:
      name: uuid
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer

  schemas:
    Error:
      type: object
      description: |
        Форма варьируется — сообщение приходит в одном из полей (§5 карты
        API). Основная задокументированная форма ошибок ресурсов
        (`/authors/{uuid}`, `/authors/{uuid}/books`, и т.д.) подтверждена
        вживую: `{"error": {"code": N, "message": "..."}}` — вложенный
        объект, а не плоские `error`/`message` на верхнем уровне.
      properties:
        message:
          type: string
          nullable: true
        error:
          nullable: true
          description: "В подтверждённых вживую ответах — объект `{code, message}`, не строка."
          oneOf:
            - type: string
            - type: object
              properties:
                code:
                  type: integer
                message:
                  type: string
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string

    SearchMeta:
      type: object
      description: "Поля подтверждены вживую для `/{resource}/search` и секций `/search`."
      properties:
        total:
          type: object
          properties:
            value:
              type: integer
            relation:
              type: string
              example: eq
              description: "Наблюдалось только значение eq"
        page:
          type: integer
        per_page:
          type: integer
        query:
          type: string
        matches_user_lang:
          type: boolean
          nullable: true
          description: "Есть не у всех типов ресурса (например, отсутствует у `users`, `bookshelves`)"
        url:
          type: string
          description: "Внутренний путь бэкенда, обслужившего запрос, например `https://books.yandex.ru/api/v5/books/search` — диагностическое поле, не для использования клиентом"

    Cover:
      type: object
      properties:
        large:
          type: string
          format: uri
          nullable: true
        small:
          type: string
          format: uri
          nullable: true
        placeholder:
          type: string
          description: base64 PNG-заглушка
          nullable: true
        ratio:
          type: number
        background_color_hex:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          description: "GraphQL-вариант отдаёт `url` вместо `large` — к REST не относится."
          nullable: true

    Person:
      type: object
      required: [uuid, name]
      description: "Поля `about`, `born_at`, `died_at`, `gender`, `external_links`, `featured_work` подтверждены вживую (`/authors/{uuid}`, `/authors/search`)."
      properties:
        name:
          type: string
        locale:
          type: string
          nullable: true
        uuid:
          type: string
        works_count:
          type: integer
        image:
          $ref: "#/components/schemas/Cover"
        removed:
          type: boolean
        about:
          type: string
          nullable: true
        born_at:
          type: string
          nullable: true
          description: "Формат не изучен — наблюдалось только `null`"
        died_at:
          type: string
          nullable: true
          description: "Формат не изучен — наблюдалось только `null`"
        gender:
          type: string
          nullable: true
        external_links:
          type: array
          items:
            type: object
          description: "Наблюдался только пустой массив — форма элемента не изучена"
        featured_work:
          nullable: true
          description: "Наблюдался только `null` в карточке автора (не в результатах поиска, где поля нет вовсе)"

    User:
      type: object
      required: [id, login]
      description: |
        Форма расходится между эндпоинтами. `/users/{id}` и вложенные
        объекты (`Impression.creator`, `Bookshelf.creator`) — полная форма
        ниже. Результаты поиска (`/{resource}/search`, секция `users` в
        `/search`) — уже: `avatar, bookshelves_count, cards_count,
        followers_count, following, gender, id, library_cards_count,
        login, name, background_color_hex`, без `uuid` и `about`.
      properties:
        uuid:
          type: string
          nullable: true
          description: "Есть в `/users/{id}`; отсутствует в объектах из результатов поиска"
        id:
          type: integer
        login:
          type: string
          description: "Название поля API, но по значению это публичный псевдоним профиля Яндекс Книг, а не логин Яндекс-аккаунта — эти два значения могут отличаться"
        name:
          type: string
        avatar:
          $ref: "#/components/schemas/Cover"
        background_color_hex:
          type: string
          nullable: true
          description: "Есть на верхнем уровне User, не только внутри Cover"
        bookshelves_count:
          type: integer
        followers_count:
          type: integer
        followings_count:
          type: integer
          x-source: "stepan163s/yandex-book-api (не подтверждено live-ответом)"
        following:
          type: boolean
          nullable: true
          description: "Подписан ли текущий пользователь на этого — анонимно всегда `false`"
        cards_count:
          type: integer
          nullable: true
          description: "Отдельно от `library_cards_count` — разница не изучена"
        library_cards_count:
          type: integer
        gender:
          type: string
          nullable: true
        about:
          type: string
          nullable: true
          x-source: "stepan163s/yandex-book-api (не подтверждено live-ответом)"

    Book:
      type: object
      required: [uuid, title]
      description: |
        Общая схема для книг/аудиокниг/комиксов: `can_be_read` у книг и
        комиксов, `can_be_listened` у аудиокниг. Поля — из сохранённого
        ответа `/users/{id}/books`. Для аудиокниг и
        комиксов см. также `Audiobook`/`Comicbook` (доп. поля поверх этой
        схемы).
      properties:
        uuid:
          type: string
        init_uuid:
          type: string
        title:
          type: string
        annotation:
          type: string
          nullable: true
        editor_annotation:
          type: string
          nullable: true
        authors:
          type: string
          description: Имена авторов одной строкой
        authors_objects:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        cover:
          $ref: "#/components/schemas/Cover"
        language:
          type: string
          nullable: true
        paper_pages:
          type: integer
          nullable: true
        restricted_reading_on_web:
          type: boolean
        type:
          type: string
          example: Book
        source_type:
          type: string
          nullable: true
        publication_date:
          type: integer
          nullable: true
          description: Год издания конкретного тиража — не путать с `original_year`
        original_year:
          type: integer
          nullable: true
        owner_catalog_title:
          type: string
          nullable: true
        is_uploaded:
          type: boolean
        bookshelves_count:
          type: integer
        impressions_count:
          type: integer
        quotes_count:
          type: integer
        readers_count:
          type: integer
        can_be_read:
          type: boolean
          description: Основной признак доступности у книг/комиксов
        can_be_listened:
          type: boolean
          description: Основной признак доступности у аудиокниг (не наблюдалось в live-ответе для книг, подтверждено по аудиокнигам)
        access_restrictions:
          type: array
          items:
            type: object
            properties:
              level:
                type: string
                example: bookmate
        age_restriction:
          type: string
          nullable: true
        in_library:
          type: boolean
          description: "В анонимном ответе всегда false — не значит, что книги нет в чьей-то библиотеке"
        in_wishlist:
          type: boolean
          description: "В анонимном ответе всегда false"
        labels:
          type: array
          items:
            type: object
        subscription_level:
          type: string
          nullable: true
        library_card:
          nullable: true
          description: "null в анонимном/публичном ответе; в авторизованном — объект LibraryCard"
          allOf:
            - $ref: "#/components/schemas/LibraryCard"
        resource_type:
