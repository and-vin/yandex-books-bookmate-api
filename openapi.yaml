  /search:
    get:
      operationId: searchAll
      summary: Поиск сразу по всем секциям каталога
      tags: [Анонимные]
      security: []
      x-verified-status: live
      x-verified-date: "2026-09-03"
      description: |
        `search` — объект с одним ключом на секцию (`books`, `audiobooks`,
        `comicbooks`, `series`, `authors`, `bookshelves`, `users`), форма
        секции — `{objects, meta}`, как у `/{resource}/search`. Кроме
        `series`: там `meta.total` — голое число, не `{value, relation}`.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Результаты, обёрнутые в ключ `search`
          content:
            application/json:
              schema:
                type: object
                properties:
                  search:
                    type: object
                    properties:
                      books:
                        type: object
                        properties:
                          objects:
                            type: array
                            items:
                              $ref: "#/components/schemas/Book"
                          meta:
                            $ref: "#/components/schemas/SearchMeta"
                      audiobooks:
                        type: object
                        properties:
                          objects:
                            type: array
                            items:
                              $ref: "#/components/schemas/Audiobook"
                          meta:
                            $ref: "#/components/schemas/SearchMeta"
                      comicbooks:
                        type: object
                        properties:
                          objects:
                            type: array
                            items:
                              $ref: "#/components/schemas/Comicbook"
                          meta:
                            $ref: "#/components/schemas/SearchMeta"
                      series:
                        type: object
                        properties:
                          objects:
                            type: array
                            items:
                              $ref: "#/components/schemas/Series"
                          meta:
                            type: object
                            description: "Здесь `total` — голое число, не `{value, relation}`"
                      authors:
                        type: object
                        properties:
                          objects:
                            type: array
                            items:
                              $ref: "#/components/schemas/Person"
                          meta:
                            $ref: "#/components/schemas/SearchMeta"
                      bookshelves:
                        type: object
                        properties:
                          objects:
                            type: array
                            items:
                              $ref: "#/components/schemas/Bookshelf"
                          meta:
                            $ref: "#/components/schemas/SearchMeta"
                      users:
                        type: object
                        properties:
                          objects:
                            type: array
                            items:
                              $ref: "#/components/schemas/User"
                          meta:
                            $ref: "#/components/schemas/SearchMeta"

  /users/{id}:
