openapi: 3.0.3
info:
  title: Bookmate / Яндекс Книги — неофициальный REST API
  version: "1.0.0"
  description: |
    Дополнение к [`API.md`](./API.md): авторизованные эндпоинты
    (профиль, личная библиотека, полки, достижения, рецензии) и GraphQL.

    Эндпоинты с `security: [AuthToken]` требуют заголовок
    `Auth-Token: y0_AgAAAA...` — получение токена описано в
    `components.securitySchemes.AuthToken`. Статус проверки каждого пути —
    `x-verified-status`, одно из:
      - `live` — подтверждён живым запросом с реальным токеном
        (см. `x-verified-date`);
      - `extrapolated` — не запрошен напрямую, форма выведена по аналогии
        с другим подтверждённым путём этого же API (источник — в `x-source`);
      - `third-party` — форма взята из независимых клиентов (в основном
        `stepan163s/yandex-book-api`), живым ответом не подтверждена
        (источник — в `x-source`);
      - `untested` — не выполнялся вживую, чтобы не мутировать данные
        аккаунта (запись/удаление), путь и параметры — из документированного
        поведения приложения.
    `/profile/reading_achievements` отвечает `410`, `/profile/series/following`
    — `404`, вопреки задокументированному в сторонних клиентах поведению.

    Эндпоинты извлечения и расшифровки контента книг не формализованы —
    см. `x-content-extraction-excluded` ниже.

    Поля схем — из реального ответа API (сохранённых авторизованных и
    анонимных ответов сервера) либо из независимых клиентов, когда живых
    данных не было (помечено `x-source`).

    Неофициальный API. Использование — на свой риск.

tags:
  - name: Анонимные
    description: Поиск и публичные карточки — без токена
  - name: Профиль
    description: Профиль текущего пользователя и служебные эндпоинты
  - name: Личная библиотека
    description: Карточки книг в личной библиотеке
  - name: Полки
    description: Книжные полки
  - name: Достижения и рецензии
    description: Цитаты, рецензии, уведомления, достижения чтения
  - name: Каталог
    description: Дерево тем/жанров каталога

x-content-extraction-excluded:
  title: "Сознательно не формализовано"
  excluded_paths:
    - GET /books/{uuid}/content/v4
    - GET /books/{uuid}/metadata/v4
    - GET /audiobooks/{uuid}/playlists.json
    - GET /comicbooks/{uuid}/metadata.json
    - GET https://reader.bookmate.com/p/a/4/d/{document_uuid}/contents/OEBPS/{href}
  what_they_are: >-
    Пути содержимого книги — зашифрованный EPUB/аудио и метаданные для
    расшифровки (ключ, IV). Детали — §3.3, §5 API.md.
  why_excluded: >-
    Формальная схема с телом на расшифровку — исполнимый контракт для снятия
    защиты с платного контента. Нарушение пользовательского соглашения
    сервиса либо обход технической защиты — сознательно не формализуется
    в этом репозитории.
  see_also:
    - API.md, §3.3
    - API.md, §5

servers:
  - url: https://api.bookmate.ru/api/v5
    description: Основной хост Яндекс Книг (эквивалент api.bookmate.yandex.net)
  - url: https://api.bookmate.yandex.net/api/v5
    description: Эквивалентный хост мобильного приложения Яндекс Книги

paths:
  # ------------------------------------------------------------------ #
  # Анонимные эндпоинты (без токена)                                    #
  # ------------------------------------------------------------------ #
  /{resource}/search:
    get:
      operationId: searchResource
      summary: Поиск по одному типу контента
      tags: [Анонимные]
      security: []
      x-verified-status: live
      x-verified-date: "2026-09-03"
      deprecated: true
      description: |
        Устарел в пользу пяти отдельных путей ниже (`/books/search` и т.д.) —
        каждый возвращает свою схему вместо общей `Book` для всех типов.
        Оставлен как задокументированный факт: параметр запроса называется
        `query`, не `q` (иначе 400); `per_page` жёстко ограничен 50 на
        сервере; если результатов меньше `per_page`, все они на странице 1 —
        страница 2 пустая.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [books, audiobooks, comicbooks, series, authors]
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          description: Результаты поиска
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Book"
                  meta:
                    type: object
                    properties:
                      total:
                        type: object
                        properties:
                          value:
                            type: integer
                      page:
                        type: integer
                      per_page:
                        type: integer
                      query:
                        type: string
        "400":
          description: Неверный параметр запроса (например, `q` вместо `query`)

  /books/search:
    get:
      operationId: searchBooks
      summary: Поиск книг
      tags: [Анонимные]
      security: []
      x-verified-status: live
      x-verified-date: "2026-09-03"
      description: |
        Параметр запроса — `query`, не `q` (иначе 400). `per_page` жёстко
        ограничен 50 на сервере.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          description: Результаты поиска
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Book"
                  meta:
                    $ref: "#/components/schemas/SearchMeta"
        "400":
          description: Неверный параметр запроса (например, `q` вместо `query`)

  /audiobooks/search:
    get:
      operationId: searchAudiobooks
      summary: Поиск аудиокниг
      tags: [Анонимные]
      security: []
      x-verified-status: live
      x-verified-date: "2026-09-03"
      description: Формат ответа и ограничения — как у `/books/search`.
      parameters:
        - name: query
