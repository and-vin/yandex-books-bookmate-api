x-graphql:
  description: |
    Не выражается в OpenAPI как path (одна операция POST с меняющимся
    телом). Эндпоинт: POST https://api-gateway.bookmate.yandex.net/graphql,
    тело {"operationName", "variables", "query"}. Работает по вайтлисту
    операций — интроспекция и произвольные запросы отбиваются.

    Подтверждённые операции: Search (variables.query: {cursor, noMisspell,
    query, types}), ProfileSubscriptions (variables.subscriptionParams),
    Statistics (variables.requestTime, ISO-8601, Auth-Token, возвращает
    user.loyalty.statistics {daysPerMonth, streak, streakRecord,
    todayTime}). Тела запросов — §4 карты API, `stepan163s/yandex-book-api`
    (`yandex_book/client.py`, `_GQL_SEARCH`, `_GQL_SUBSCRIPTIONS`,
    `_GQL_STATISTICS`). Не проверено.
