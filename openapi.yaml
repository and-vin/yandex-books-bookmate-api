    post:
      operationId: addBookToLibrary
      summary: Добавить книгу в личную библиотеку
      tags: [Личная библиотека]
      description: |
        `200` с полным объектом `library_card`. Если книга уже в личной
        библиотеке — `422 {"errors": "Эта книга уже есть в вашей
        библиотеке"}` (не `409 Conflict`) — надёжный сигнал «уже
        отслеживается», надёжнее листинга `GET /profile/library_cards`.
      security: [{AuthToken: []}]
      x-verified-status: live
      x-verified-date: "2026-09-03"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                book_uuid:
                  type: string
              required: [book_uuid]
      responses:
        "200":
          description: Добавлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  library_card:
                    $ref: "#/components/schemas/LibraryCard"
        "422":
          description: "Книга уже в библиотеке: `{\"errors\": \"Эта книга уже есть в вашей библиотеке\"}`"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile/library_cards/{uuid}:
    put:
      operationId: updateLibraryCard
      summary: Изменить карточку (прогресс чтения, приватность)
      tags: [Личная библиотека]
      description: |
        Тело с `progress`/`state: "finished"` реально помечает книгу
        прочитанной: значение сохраняется на сервере (виден в повторном
        `GET` и в клиенте), не только эхом в ответе `200`.
        `started_at`/`finished_at` через этот путь read-only: сервер
        отвечает `200` на попытку их переписать, но значение при повторном
        `GET` не меняется — сервер проставляет их сам при первой
        простановке `state`.
      security: [{AuthToken: []}]
      x-verified-status: live
      x-verified-date: "2026-09-03"
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lc:
                  type: object
                  properties:
                    uuid:
                      type: string
                    public:
                      type: boolean
                    progress:
                      type: integer
                      minimum: 0
                      maximum: 100
                      description: "Подтверждено: реально применяется на сервере и видно в клиенте (не только 200 в ответе)"
                    state:
                      type: string
                      description: "Подтверждено: значение finished реально применяется на сервере и видно в клиенте как «прочитано». Допустимые значения enum кроме finished не перечислены"
                    started_at:
                      type: integer
                      description: "Unix timestamp. Сервер отвечает 200 на попытку переписать значение, но при повторном GET поле не меняется — read-only через этот путь"
                    finished_at:
                      type: integer
                      description: "Unix timestamp. Сервер отвечает 200 на попытку переписать значение, но при повторном GET поле не меняется — read-only через этот путь (см. started_at)"
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: removeLibraryCard
      summary: Удалить книгу из личной библиотеки
      tags: [Личная библиотека]
      description: Не проверялось вживую (мутирующая операция).
      security: [{AuthToken: []}]
      x-verified-status: untested
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "204":
          description: Удалено
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile/upload_books:
    post:
      operationId: uploadBook
      summary: Загрузить свою книгу («Загрузить с устройства», раздел «Все книги»)
      tags: [Личная библиотека]
      description: |
        Поля формы: `public` (`"true"`/`"false"`, обязательно) и `files[]`
        (сам файл; другие имена поля дают `422`). Принимает только
        `.epub`/`.fb2` — `.fbz`/`.zip`/`.pdf` отклоняются, zip нужно
        распаковать на клиенте до `.fb2` внутри.

        Успех → `204` без тела. Загруженная книга появляется в
        `GET /profile/library_cards` с `state: "pending"`,
        `is_uploaded: true`. Новую карточку нужно ловить diff'ом множества
        `uuid` до/после запроса, не по `title`: сервер
        переводит/нормализует заголовок (например `"Luna: Wolf Moon"` →
        `"Волчья Луна"`), а повторная загрузка того же содержимого может
        смёрджиться в уже существующую карточку вместо создания новой (без
        ошибки, без нового `uuid`). Чтобы пометить книгу прочитанной —
        `PUT /profile/library_cards/{uuid}` (см. `updateLibraryCard`); он
        одинаково работает и на только что созданной карточке, и на
        карточке в `state: "pending"` из более ранней загрузки.

        Требует заголовков реального браузера: `User-Agent` (не
        `okhttp/…`), `Origin: https://books.yandex.ru`,
        `Referer: https://books.yandex.ru/upload`. Без них (нестандартный
        `User-Agent` вместе с квадратными скобками в имени поля формы)
        соединение обрывается (`ConnectionResetError`) вместо осмысленного
        кода ответа.

        **Рейт-лимит, независимый от остального API.** После ~9–10
        загрузок подряд каждый следующий `POST` отвечает `403` с пустым
        телом. Не короткий burst-лимит: держится не меньше 45–50 минут,
        бэкофф в 10–25 секунд не помогает. Ограничен именно этим путём:
        пока он активен, анонимные эндпоинты (`/search`, `/books/{uuid}`)
        и `POST /profile/library_cards` (добавление уже каталожной книги
        по `uuid`, без файла — см. `addBookToLibrary`) отвечают нормально.
        Практический вывод: пакетами по ~10 книг с паузой в десятки минут
        между пакетами; для книг, уже присутствующих в публичном
        каталоге, `addBookToLibrary` — рабочий путь в обход этой ручки.
      security: [{AuthToken: []}]
      x-verified-status: live
      x-verified-date: "2026-09-11"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                public:
                  type: string
                  description: "Строка \"true\"/\"false\", не boolean — обязательное поле"
                files[]:
                  type: string
                  format: binary
                  description: ".epub или .fb2; другие форматы веб-загрузка отклоняет"
              required: [public, "files[]"]
      responses:
        "204":
          description: "Загружено. Новая карточка появляется в GET /profile/library_cards с state: pending, is_uploaded: true — без тела ответа тут её uuid не узнать"
        "403":
          description: "Рейт-лимит после ~9–10 загрузок подряд, пустое тело. Держится 45–50+ минут, ретраи/бэкофф не помогают"
        "401":
          $ref: "#/components/responses/Unauthorized"

