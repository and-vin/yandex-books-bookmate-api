      summary: Карточки личной библиотеки
      tags: [Личная библиотека]
      description: |
        `per_page` задаёт размер страницы, `page=2` отдаёт следующую
        непересекающуюся страницу — рабочая пагинация для полного
        листинга. Для проверки «уже ли книга в библиотеке» надёжнее ответ
        `POST /profile/library_cards` (см. `addBookToLibrary`), чем
        листинг этого эндпоинта.
      security: [{AuthToken: []}]
      x-verified-status: live
      x-verified-date: "2026-09-15"
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: "page=2 отдаёт следующую непересекающуюся страницу"
        - name: per_page
          in: query
          schema:
            type: integer
            maximum: 50
          description: "Размер страницы; сервер молча ограничивает значениями выше 50 — при per_page=51 и выше в ответе всё равно 50 карточек"
      responses:
        "200":
          description: Список карточек
          content:
            application/json:
              schema:
                type: object
                properties:
                  library_cards:
                    type: array
                    items:
                      $ref: "#/components/schemas/LibraryCard"
        "401":
